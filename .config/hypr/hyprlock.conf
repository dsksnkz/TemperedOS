general {
    hide_cursor = true
    grace = 2
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 9
    brightness = 0.68
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(238, 245, 255, 1.0)
    font_size = 68
    font_family = Inter SemiBold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(220, 232, 245, 0.72)
    font_size = 14
    font_family = Inter
    position = 0, 18
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 1
    dots_size = 0.18
    dots_spacing = 0.30
    outer_color = rgba(190, 220, 245, 0.34)
    inner_color = rgba(24, 34, 48, 0.62)
    font_color = rgba(240, 247, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##b7c7d9">unlock</span>
    rounding = 22
    position = 0, -92
    halign = center
    valign = center
}
